[project]
name = "backend"
version = "0.1.0"
description = "Cartographer spatial search API with licensed imagery, vision, caching and spending caps"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "httpx>=0.28.1",
    "openai>=3.24.0",
    "pillow>=12.3.0",
    "pymongo>=4.18.2",
    "python-dotenv>=1.2.4",
    "waitress>=3.0.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=.cache/pytest"
